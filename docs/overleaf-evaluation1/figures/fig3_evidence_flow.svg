<svg xmlns="http://www.w3.org/2000/svg" width="7.16in" height="7.5387in" viewBox="0 0 1040 1095" role="img" aria-labelledby="title desc">
<title id="title">Durable Audit and Evidence Flow</title><desc id="desc">Exact M4 persistence-before-forwarding ordering. Later sealing, offline verification and M5 acceptance are separate. Failures block forwarding; post-commit mutation is outside the prevention guarantee.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#111} .bold{font-weight:600} .small{font-size:18px} .tiny{font-size:17px} rect,line,path{vector-effect:non-scaling-stroke} .arrow{fill:none;stroke:#333;stroke-width:1;marker-end:url(#arrow)} .dashed{stroke-dasharray:4 4}</style>
<rect width="1040" height="1095" fill="#fff"/>
<text x="319" y="28" text-anchor="middle" class="bold">
<tspan x="319" dy="0">M4: before-forwarding admission gate</tspan>
</text>
<text x="857" y="28" text-anchor="middle" class="bold">
<tspan x="857" dy="0">Later evidence checks</tspan>
</text>
<rect x="20" y="48" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="76.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">01  Proposal</tspan>
</text>
<rect x="20" y="110" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="138.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">02  Detector findings</tspan>
</text>
<path d="M320 92 L320 110" class="arrow"/>
<rect x="20" y="172" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="200.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">03  Decision</tspan>
</text>
<path d="M320 154 L320 172" class="arrow"/>
<rect x="20" y="234" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="262.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">04  Dispatch intent</tspan>
</text>
<path d="M320 216 L320 234" class="arrow"/>
<rect x="20" y="296" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="324.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">05  Freeze expected audit batch / candidate state</tspan>
</text>
<path d="M320 278 L320 296" class="arrow"/>
<rect x="20" y="358" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="386.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">06  BEGIN IMMEDIATE</tspan>
</text>
<path d="M320 340 L320 358" class="arrow"/>
<rect x="20" y="420" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="448.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">07  Validate approved schema</tspan>
</text>
<path d="M320 402 L320 420" class="arrow"/>
<rect x="20" y="482" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="510.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">08  Insert complete batch</tspan>
</text>
<path d="M320 464 L320 482" class="arrow"/>
<rect x="20" y="544" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="572.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">09  Exact readback against expected records + manifest</tspan>
</text>
<path d="M320 526 L320 544" class="arrow"/>
<rect x="20" y="606" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="634.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">10  Confirmed COMMIT</tspan>
</text>
<path d="M320 588 L320 606" class="arrow"/>
<rect x="20" y="668" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="696.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">11  Advance trusted continuity / cryptographic / semantic state</tspan>
</text>
<path d="M320 650 L320 668" class="arrow"/>
<rect x="20" y="730" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="758.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">12  Successful admission receipt</tspan>
</text>
<path d="M320 712 L320 730" class="arrow"/>
<rect x="20" y="792" width="600" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="320.0" y="820.0" text-anchor="middle" class="small">
<tspan x="320.0" dy="0">13  Downstream MCP forwarding</tspan>
</text>
<path d="M320 774 L320 792" class="arrow"/>
<path d="M620 628 L656 628 L656 86 L692 86" class="arrow dashed"/>
<text x="857" y="53" text-anchor="middle" class="small">
<tspan x="857" dy="0">M4: committed record representation</tspan>
</text>
<rect x="692" y="64" width="326" height="56" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="855.0" y="98.0" text-anchor="middle" class="small">
<tspan x="855.0" dy="0">Audit records</tspan>
</text>
<rect x="692" y="145" width="326" height="65" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="855.0" y="171.0" text-anchor="middle" class="small">
<tspan x="855.0" dy="0">Canonical representation</tspan>
<tspan x="855.0" dy="25">Restricted UTF-8 JSON</tspan>
</text>
<path d="M855 120 L855 145" class="arrow"/>
<rect x="692" y="235" width="326" height="65" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="855.0" y="261.0" text-anchor="middle" class="small">
<tspan x="855.0" dy="0">SHA-256 hash chain</tspan>
<tspan x="855.0" dy="25">Manifest + ordered event links</tspan>
</text>
<path d="M855 210 L855 235" class="arrow"/>
<rect x="692" y="325" width="326" height="92" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="855.0" y="352.0" text-anchor="middle" class="small">
<tspan x="855.0" dy="0">Clean closure: freeze trusted state</tspan>
<tspan x="855.0" dy="25">Validate exact export snapshot</tspan>
<tspan x="855.0" dy="25">against trusted count / head</tspan>
</text>
<path d="M855 300 L855 325" class="arrow"/>
<rect x="692" y="442" width="326" height="65" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="855.0" y="468.0" text-anchor="middle" class="small">
<tspan x="855.0" dy="0">ECDSA P-256/SHA-256 closure</tspan>
<tspan x="855.0" dy="25">Sign the validated snapshot</tspan>
</text>
<path d="M855 417 L855 442" class="arrow"/>
<rect x="692" y="532" width="326" height="116" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="855.0" y="558.5" text-anchor="middle" class="small">
<tspan x="855.0" dy="0">Offline verifier (repeatable INSPECT)</tspan>
<tspan x="855.0" dy="25">Structure / commitment / signature</tspan>
<tspan x="855.0" dy="25">Context / completeness</tspan>
<tspan x="855.0" dy="25">Finding reproduction</tspan>
</text>
<path d="M855 507 L855 532" class="arrow"/>
<rect x="692" y="675" width="326" height="141" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="855.0" y="701.5" text-anchor="middle" class="small">
<tspan x="855.0" dy="0">M5: expected-run acceptance</tspan>
<tspan x="855.0" dy="25">External challenge + exact inventory</tspan>
<tspan x="855.0" dy="25">All required dimensions PASS</tspan>
<tspan x="855.0" dy="25">Confirmed durable registry COMMIT</tspan>
<tspan x="855.0" dy="25">Duplicate / stale submission rejected</tspan>
</text>
<path d="M855 648 L855 675" class="arrow"/>
<text x="320" y="864" text-anchor="middle" class="small">
<tspan x="320" dy="0">Canonical bytes and candidate hashes are prepared before the transaction.</tspan>
<tspan x="320" dy="25">The evidence lane shows data dependencies and later sealing / checks.</tspan>
</text>
<line x1="20" y1="900" x2="1018" y2="900" stroke="#777" stroke-width="1"/>
<rect x="20" y="922" width="998" height="145" fill="#fafafa" stroke="#333" stroke-width="1"/>
<text x="40" y="949" text-anchor="start" class="small">
<tspan x="40" dy="0">Schema / insertion / readback failure → rollback + halt + no forwarding.</tspan>
<tspan x="40" dy="25">Ambiguous COMMIT → halt; no retry, database adoption or forwarding.</tspan>
<tspan x="40" dy="25">Post-commit mutation is outside the prevention guarantee; later sealing / verification</tspan>
<tspan x="40" dy="25">can detect divergence. SQLite persistence and external tool effects are not atomic.</tspan>
<tspan x="40" dy="25">Verification checks evidence consistency / origin; acceptance does not establish truth.</tspan>
</text>
</svg>
