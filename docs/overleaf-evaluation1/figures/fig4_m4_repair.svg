<svg xmlns="http://www.w3.org/2000/svg" width="7.16in" height="6.9810in" viewBox="0 0 1040 1014" role="img" aria-labelledby="title desc">
<title id="title">M4 Persistence-Gate Discovery and Repair</title><desc id="desc">AF-001 before and after repair. Successful SQL acknowledgments did not prove exact materialization. Exact schema/batch/manifest readback closes the pre-forwarding gap under the stated trust boundary.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#111} .bold{font-weight:600} .small{font-size:18px} .tiny{font-size:17px} rect,line,path{vector-effect:non-scaling-stroke} .arrow{fill:none;stroke:#333;stroke-width:1;marker-end:url(#arrow)} .dashed{stroke-dasharray:4 4}</style>
<rect width="1040" height="1014" fill="#fff"/>
<text x="268" y="28" text-anchor="middle" class="bold">
<tspan x="268" dy="0">Before: discovered persistence gap</tspan>
</text>
<text x="776" y="28" text-anchor="middle" class="bold">
<tspan x="776" dy="0">After: repaired admission gate</tspan>
</text>
<line x1="520" y1="45" x2="520" y2="882" stroke="#777" stroke-width="1"/>
<rect x="24" y="53" width="484" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="266.0" y="83.0" text-anchor="middle" class="small">
<tspan x="266.0" dy="0">Prepared batch</tspan>
</text>
<rect x="24" y="123" width="484" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="266.0" y="153.0" text-anchor="middle" class="small">
<tspan x="266.0" dy="0">SQL insert statements appear successful</tspan>
</text>
<path d="M266 101 L266 123" class="arrow"/>
<rect x="24" y="193" width="484" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="266.0" y="223.0" text-anchor="middle" class="small">
<tspan x="266.0" dy="0">COMMIT succeeds</tspan>
</text>
<path d="M266 171 L266 193" class="arrow"/>
<rect x="24" y="263" width="484" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="266.0" y="293.0" text-anchor="middle" class="small">
<tspan x="266.0" dy="0">Trusted state advances</tspan>
</text>
<path d="M266 241 L266 263" class="arrow"/>
<rect x="24" y="333" width="484" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="266.0" y="363.0" text-anchor="middle" class="small">
<tspan x="266.0" dy="0">Forwarding occurs</tspan>
</text>
<path d="M266 311 L266 333" class="arrow"/>
<rect x="24" y="420" width="484" height="98" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="266.0" y="450.0" text-anchor="middle" class="small">
<tspan x="266.0" dy="0">Modified SQLite behavior</tspan>
<tspan x="266.0" dy="25">Suppresses / alters required persistence</tspan>
<tspan x="266.0" dy="25">SQL acknowledgments alone conceal the mismatch</tspan>
</text>
<path d="M24 469 L12 469 L12 147 L24 147" class="arrow dashed"/>
<text x="266" y="549" text-anchor="middle" class="small">
<tspan x="266" dy="0">trusted state no longer matches persisted evidence</tspan>
</text>
<rect x="24" y="566" width="222" height="104" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="135.0" y="611.0" text-anchor="middle" class="small">
<tspan x="135.0" dy="0">TRUSTED STATE</tspan>
<tspan x="135.0" dy="25">“trusted count advanced”</tspan>
</text>
<rect x="284" y="566" width="224" height="104" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="396.0" y="588.0" text-anchor="middle" class="small">
<tspan x="396.0" dy="0">ACTUAL AUDIT</tspan>
<tspan x="396.0" dy="23">STORAGE</tspan>
<tspan x="396.0" dy="23">“required records</tspan>
<tspan x="396.0" dy="23">suppressed or altered”</tspan>
</text>
<text x="266" y="624" text-anchor="middle" class="bold">
<tspan x="266" dy="0">≠</tspan>
</text>
<rect x="24" y="683" width="484" height="88" fill="#fafafa" stroke="#333" stroke-width="1"/>
<text x="266.0" y="720.5" text-anchor="middle" class="bold">
<tspan x="266.0" dy="0">Tool calls executed despite</tspan>
<tspan x="266.0" dy="25">incomplete persisted evidence</tspan>
</text>
<text x="266" y="805" text-anchor="middle" class="small">
<tspan x="266" dy="0">Later sealing refused the stream.</tspan>
<tspan x="266" dy="25">This was a persistence gap, not a cryptographic forgery.</tspan>
</text>
<rect x="540" y="53" width="478" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="83.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Freeze expected batch / candidate state</tspan>
</text>
<rect x="540" y="124" width="478" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="152.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">BEGIN IMMEDIATE</tspan>
</text>
<path d="M779 101 L779 124" class="arrow"/>
<rect x="540" y="190" width="478" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="220.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Validate approved schema</tspan>
</text>
<path d="M779 168 L779 190" class="arrow"/>
<rect x="540" y="261" width="478" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="289.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Insert complete batch</tspan>
</text>
<path d="M779 238 L779 261" class="arrow"/>
<rect x="540" y="327" width="478" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="357.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Exact readback of persisted rows</tspan>
</text>
<path d="M779 305 L779 327" class="arrow"/>
<rect x="540" y="398" width="478" height="126" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="429.5" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Compare sequence, event IDs, event types,</tspan>
<tspan x="779.0" dy="25">metadata, canonical bytes, hashes,</tspan>
<tspan x="779.0" dy="25">predecessor links; exact manifest</tspan>
<tspan x="779.0" dy="25">bytes / digest must also match</tspan>
</text>
<path d="M779 375 L779 398" class="arrow"/>
<rect x="540" y="551" width="478" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="579.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Confirmed COMMIT</tspan>
</text>
<path d="M779 524 L779 551" class="arrow"/>
<rect x="540" y="621" width="478" height="48" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="651.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Trusted state advance</tspan>
</text>
<path d="M779 595 L779 621" class="arrow"/>
<rect x="540" y="692" width="478" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="720.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Successful admission receipt</tspan>
</text>
<path d="M779 669 L779 692" class="arrow"/>
<rect x="540" y="762" width="478" height="44" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="790.0" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Forwarding</tspan>
</text>
<path d="M779 736 L779 762" class="arrow"/>
<rect x="540" y="825" width="478" height="58" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="779.0" y="847.5" text-anchor="middle" class="small">
<tspan x="779.0" dy="0">Validation / readback failure</tspan>
<tspan x="779.0" dy="25">Rollback + halt + no forwarding</tspan>
</text>
<path d="M1018 351 L1028 351 L1028 854 L1018 854" class="arrow dashed"/>
<line x1="24" y1="900" x2="1018" y2="900" stroke="#777" stroke-width="1"/>
<rect x="24" y="920" width="994" height="80" fill="#fafafa" stroke="#333" stroke-width="1"/>
<text x="521" y="942" text-anchor="middle" class="small">
<tspan x="521" dy="0">Repair closes the pre-forwarding persistence gap under SQLite / trusted-runtime assumptions.</tspan>
<tspan x="521" dy="23">Post-commit mutation remains detectable by later sealing/verification;</tspan>
<tspan x="521" dy="23">it is outside the pre-forwarding prevention guarantee.</tspan>
</text>
</svg>
