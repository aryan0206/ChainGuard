<tspan x="280" dy="0">E07 Execution/failure boundaries</tspan>
<tspan x="280" dy="27">E08 External baseline</tspan>
</text>
<rect x="20" y="573" width="240" height="105" fill="#fafafa" stroke="#333" stroke-width="1"/>
<rect x="260" y="573" width="760" height="105" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="140" y="631.5" text-anchor="middle" class="bold">
<tspan x="140" dy="0">Evidence / assurance</tspan>
</text>
<text x="280" y="601" text-anchor="start">
