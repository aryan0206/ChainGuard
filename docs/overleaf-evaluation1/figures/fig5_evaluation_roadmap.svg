<svg xmlns="http://www.w3.org/2000/svg" width="7.16in" height="5.4526in" viewBox="0 0 1040 792" role="img" aria-labelledby="title desc">
<title id="title">Evaluation Protocol E01–E13</title><desc id="desc">Current M1–M5 engineering foundation separated from planned final E01–E13 empirical study. Groups are a reading aid, not execution order. No final experiment is marked completed.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#111} .bold{font-weight:600} .small{font-size:18px} .tiny{font-size:17px} rect,line,path{vector-effect:non-scaling-stroke} .arrow{fill:none;stroke:#333;stroke-width:1;marker-end:url(#arrow)} .dashed{stroke-dasharray:4 4}</style>
<rect width="1040" height="792" fill="#fff"/>
<rect x="20" y="20" width="1000" height="125" fill="#fafafa" stroke="#333" stroke-width="1"/>
<text x="520" y="48" text-anchor="middle" class="bold">
<tspan x="520" dy="0">CURRENT ENGINEERING BASELINE</tspan>
</text>
<text x="520" y="77" text-anchor="middle" class="small">
<tspan x="520" dy="0">M1: stdio mediation   ·   M2: replay representations + independent oracle</tspan>
</text>
<text x="520" y="104" text-anchor="middle" class="small">
<tspan x="520" dy="0">M3: durable audit   ·   M4: signed evidence / offline checks   ·   M5: expected-run acceptance</tspan>
</text>
<text x="520" y="130" text-anchor="middle" class="small">
<tspan x="520" dy="0">M1–M5 are the Evaluation-1 foundation; M6 live lifecycle remains pending.</tspan>
</text>
<path d="M520 145 L520 177" class="arrow"/>
<text x="520" y="205" text-anchor="middle" class="bold">
<tspan x="520" dy="0">PLANNED / FINAL EMPIRICAL EVALUATION</tspan>
</text>
<text x="520" y="233" text-anchor="middle" class="small">
<tspan x="520" dy="0">E01–E13: no completed final experiments; engineering checks are supporting evidence.</tspan>
</text>
<rect x="20" y="258" width="240" height="132" fill="#fafafa" stroke="#333" stroke-width="1"/>
<rect x="260" y="258" width="760" height="132" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="140" y="330.0" text-anchor="middle" class="bold">
<tspan x="140" dy="0">Representation</tspan>
</text>
<text x="280" y="286" text-anchor="start">
<tspan x="280" dy="0">E01 Order-insensitive controls</tspan>
<tspan x="280" dy="27">E02 Matched order-sensitive groups</tspan>
<tspan x="280" dy="27">E03 Historical recognition</tspan>
<tspan x="280" dy="27">E13 Invariance/explanation</tspan>
</text>
<rect x="20" y="390" width="240" height="105" fill="#fafafa" stroke="#333" stroke-width="1"/>
<rect x="260" y="390" width="760" height="105" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="140" y="448.5" text-anchor="middle" class="bold">
<tspan x="140" dy="0">Decision / control</tspan>
</text>
<text x="280" y="418" text-anchor="start">
<tspan x="280" dy="0">E04 Detector/controller attribution</tspan>
<tspan x="280" dy="27">E05 Held-out workflows</tspan>
<tspan x="280" dy="27">E06 Live M6 lifecycle</tspan>
</text>
<rect x="20" y="495" width="240" height="78" fill="#fafafa" stroke="#333" stroke-width="1"/>
<rect x="260" y="495" width="760" height="78" fill="#fff" stroke="#333" stroke-width="1"/>
<text x="140" y="540.0" text-anchor="middle" class="bold">
<tspan x="140" dy="0">Failure / baseline</tspan>
</text>
